<html><head><meta charset="utf-8">

<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30,DUR=60,SUB=3;
const cv=document.getElementById('c'),ctx0=cv.getContext('2d');
const scn=document.createElement('canvas');scn.width=W;scn.height=H;
let ctx=scn.getContext('2d');
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const actx=acc.getContext('2d');
// ================= TIMELINE =================
const T_GONE=3.0,T_ENGINE=4.2,T_BLACK=6.6,T_TRAIN=11,T_DROP=14.5,T_SPACE=19,T_BIRDS=27,T_DATA=34,T_FAIL=37.6,T_BACK=42,T_AFTER=48,T_PHONE=53.2,T_END=56;
// ================= UTILS =================
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(7);
const rr=(a,b)=>a+(b-a)*R();
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const easeOut=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
function hash(a,b){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function mul(a,s){return[a[0]*s,a[1]*s,a[2]*s]}
function css(c,al){const r=Math.round(clamp(c[0],0,255)),g=Math.round(clamp(c[1],0,255)),b=Math.round(clamp(c[2],0,255));return al==null?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${al})`}
// ================= CAMERA / 3D =================
let F=930;const cam={x:0,y:0,z:0,yaw:0,pitch:0,roll:0};
let fwd,rgt,up,cR=1,sR=0;
function setCam(){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const f0=[-sy,0,-cy];rgt=[cy,0,-sy];fwd=[f0[0]*cp,sp,f0[2]*cp];up=[-f0[0]*sp,cp,-f0[2]*sp];cR=Math.cos(cam.roll);sR=Math.sin(cam.roll)}
function lookAt(tx,ty,tz){const dx=tx-cam.x,dy=ty-cam.y,dz=tz-cam.z;cam.yaw=Math.atan2(-dx,-dz);cam.pitch=Math.atan2(dy,Math.hypot(dx,dz))}
function toCam(p){const dx=p[0]-cam.x,dy=p[1]-cam.y,dz=p[2]-cam.z;return[dx*rgt[0]+dz*rgt[2],dx*up[0]+dy*up[1]+dz*up[2],dx*fwd[0]+dy*fwd[1]+dz*fwd[2]]}
const NEAR=0.25;let shakeX=0,shakeY=0;
function clipNear(ps){const out=[];for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length];const ain=a[2]>=NEAR,bin=b[2]>=NEAR;if(ain)out.push(a);
  if(ain!==bin){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}return out}
function scr(c){const x=F*c[0]/c[2],y=-F*c[1]/c[2];return[W/2+cR*x-sR*y+shakeX,H*0.5+sR*x+cR*y+shakeY]}
let FOG=hex('#e9a991'),FOGD=150,FOGMAX=0.9;
function fogC(c,d){const f=(1-Math.exp(-Math.max(0,d)/FOGD))*FOGMAX;return mix(c,FOG,f)}
function polyPath(cp){ctx.beginPath();cp.forEach((c,i)=>{const s=scr(c);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath()}
function poly(worldPts,col,alpha){const cp=clipNear(worldPts.map(toCam));if(cp.length<3)return null;polyPath(cp);
  ctx.fillStyle=typeof col==='string'?col:css(col,alpha);ctx.fill();if(alpha==null){ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1;ctx.stroke()}return cp}
function dist(p){return toCam(p)[2]}
let L=[-0.35,0.8,0.5];function setLight(v){const n=Math.hypot(...v);L=v.map(x=>x/n)}
let AMB=0.58;function shade(n){return AMB+(1-AMB)*Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2])}
function boxFaces(cx,cz,y0,y1,w,l,yaw,cols){
  const c=Math.cos(yaw),s=Math.sin(yaw);const P=(lx,y,lz)=>[cx+lx*c+lz*s,y,cz-lx*s+lz*c];const hw=w/2,hl=l/2;
  const v={a:P(-hw,y0,-hl),b:P(hw,y0,-hl),c:P(hw,y0,hl),d:P(-hw,y0,hl),e:P(-hw,y1,-hl),f:P(hw,y1,-hl),g:P(hw,y1,hl),h:P(-hw,y1,hl)};
  const N=(lx,lz)=>[lx*c+lz*s,0,-lx*s+lz*c];
  const faces=[{k:'top',p:[v.e,v.f,v.g,v.h],n:[0,1,0]},{k:'bottom',p:[v.a,v.d,v.c,v.b],n:[0,-1,0]},{k:'side',p:[v.b,v.c,v.g,v.f],n:N(1,0)},{k:'side',p:[v.d,v.a,v.e,v.h],n:N(-1,0)},
    {k:'front',p:[v.c,v.d,v.h,v.g],n:N(0,1)},{k:'back',p:[v.a,v.b,v.f,v.e],n:N(0,-1)}];
  const out=[];for(const f of faces){const col=cols[f.k]||(f.k==='bottom'?null:cols.side);if(!col)continue;
    const ctr=f.p.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4,a[2]+p[2]/4],[0,0,0]);
    const vc=[cam.x-ctr[0],cam.y-ctr[1],cam.z-ctr[2]];if(vc[0]*f.n[0]+vc[1]*f.n[1]+vc[2]*f.n[2]<=0)continue;
    out.push({p:f.p,n:f.n,k:f.k,col,d:dist(ctr),P})}
  out.sort((a,b)=>b.d-a.d);return out}
function drawFaces(fs,extra){for(const f of fs){poly(f.p,fogC(mul(f.col,shade(f.n)),f.d));if(extra)extra(f)}}
// generic polygon face list (custom shapes): pts world, normal computed
function nrm(p){const a=p[0],b=p[1],c=p[2];const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const m=Math.hypot(...n)||1;return n.map(x=>x/m)}
function facePoly(pts,col,twoSided){const n=nrm(pts);const ctr=pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length,a[2]+p[2]/pts.length],[0,0,0]);
  const vc=[cam.x-ctr[0],cam.y-ctr[1],cam.z-ctr[2]];let dt=vc[0]*n[0]+vc[1]*n[1]+vc[2]*n[2];
  if(dt<=0){if(!twoSided)return;n[0]=-n[0];n[1]=-n[1];n[2]=-n[2]}
  const d=dist(ctr);poly(pts,fogC(mul(col,shade(n)),d))}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,css(col,a));g.addColorStop(1,css(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
// Catmull-Rom keyframes
function keyCam(keys,t){let i=0;while(i<keys.length-2&&t>keys[i+1].t)i++;
  const k1=keys[i],k2=keys[i+1],k0=keys[Math.max(0,i-1)],k3=keys[Math.min(keys.length-1,i+2)];
  const u=clamp((t-k1.t)/(k2.t-k1.t),0,1);const out={};
  for(const p of ['x','y','z','yaw','pitch','roll']){const p0=k0[p],p1=k1[p],p2=k2[p],p3=k3[p];
    out[p]=0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u)}return out}
function setFrom(o){Object.assign(cam,o)}
// ================= TEXT =================
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function capsule(x,y,w,h){rrect(x,y,w,h,w/2)}
function txt(s,x,y,size,col,align,weight,stroke){ctx.font=`${weight||900} ${size}px Inter, "Noto Color Emoji"`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke!==false){ctx.lineJoin='round';ctx.lineWidth=size*0.2;ctx.strokeStyle='rgba(25,15,35,0.92)';ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function fitSize(s,maxW,size,weight){ctx.font=`${weight||900} ${size}px Inter, "Noto Color Emoji"`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size}

// ======================================================================
// ============================ CITY SCENE ==============================
// ======================================================================
R=rng(7);
const bcols=['#8a93ab','#a59f9a','#7a8398','#b2b5c3','#9499b2','#a8a2b8','#8f8aa0'];
const billPal=[['#ff3d8b','#ffb03d'],['#3dd9ff','#7a3dff'],['#ff5e3d','#ffe03d'],['#3dffb0','#3d8bff'],['#ff3df2','#3d5bff'],['#ffffff','#8fd6ff'],['#ffe23d','#ff3d6e'],['#7dff3d','#00b3ff']];
const buildings=[];
function makeSide(side){let z=40;
  while(z>-240){const len=rr(14,26),h=z>-60?rr(45,85):rr(28,70),d=rr(10,16);const inner=side<0?-14:14;
    const b={side,x0:side<0?inner-d:inner,x1:side<0?inner:inner+d,z0:z-len,z1:z,h,col:hex(pick(bcols)),wins:[],bills:[]};
    for(let v=14;v<h-3;v+=3.2)for(let u=b.z0+1.5;u<b.z1-1.5;u+=2.6)b.wins.push([u,v,R()<0.5,R()]);
    let u=b.z0+0.8;while(u<b.z1-3){const bw=Math.min(rr(4,10),b.z1-0.8-u);if(bw<3)break;const vy=rr(3,5);
      b.bills.push({u0:u,u1:u+bw,v0:vy,v1:Math.min(vy+rr(4,8),13),pal:pick(billPal),flick:R()});
      if(R()<0.5){const v2=rr(14,20);b.bills.push({u0:u,u1:u+bw,v0:v2,v1:v2+rr(4,9),pal:pick(billPal),flick:R()})}u+=bw+rr(0.6,3)}
    buildings.push(b);z-=len}}
makeSide(-1);makeSide(1);
const tower={x0:-8,x1:6,z0:-232,z1:-218,h:78,col:hex('#a9adbd')};
const backdrop=[];for(let i=0;i<9;i++){const x=-60+i*14+rr(-3,3);backdrop.push({x0:x,x1:x+rr(10,14),z0:-270,z1:-258,h:rr(40,110),col:hex(pick(bcols))})}
const lamps=[];for(let z=-24;z>-220;z-=22)lamps.push({x:-1.4,z});
const carCols=['#f2c230','#f2c230','#e8eaee','#b9bec8','#d6453d','#3e6fd8','#2b2d33','#f2c230'];
const cars=[];
function addCar(x,dir,zAtOff,v0,decel,col){cars.push({x,dir,zOff:zAtOff,v0,decel,col:hex(col||pick(carCols))})}
[[30,6],[8,5],[-9,6],[-22,11],[-31,0.0],[-47,4],[-63,5],[-80,4],[-97,5],[-115,4],[-133,4],[-150,5]].forEach(([z,d],i)=>addCar(-6.6,1,z,9,d,i===3?'#e8eaee':i===4?'#f2c230':null));
[[-6,5],[-20,6],[-37,4],[-52,5],[-71,6],[-92,4],[-118,5],[-140,4],[-165,5]].forEach(([z,d])=>addCar(-3.5,-1,z,8,d));
for(let z=-6;z>-170;z-=rr(5.4,7)){if(R()<0.12)continue;cars.push({x:-9.1,dir:1,parked:true,z,col:hex(pick(carCols)),yaw:0})}
for(let z=30;z>-6;z-=rr(5.4,7)){cars.push({x:-9.1,dir:1,parked:true,z,col:hex(pick(carCols)),yaw:0})}
const crashes=[],smoke=[];
(function sim(){const dt=1/600,TS=16;const mv=cars.filter(c=>!c.parked);
  mv.forEach(c=>{c.z=c.zOff-c.dir*c.v0*T_ENGINE;c.v=c.v0;c.yaw=c.dir>0?0:Math.PI;c.yawT=c.yaw;c.track=[];c.brake=0;c.crashed=false});
  let fi=0;const SR=FPS*SUB;
  for(let step=0;step*dt<=TS;step++){const t=step*dt;
    while(t>=fi/SR-1e-9){mv.forEach(c=>c.track.push([c.z,c.yaw,c.brake]));fi++}
    mv.forEach(c=>{if(t>=T_ENGINE){c.v=Math.max(0,c.v-(c.crashed?9:c.decel)*dt);c.brake=1}c.z+=c.dir*c.v*dt;c.yaw+=(c.yawT-c.yaw)*Math.min(1,dt*9)});
    [1,-1].forEach(dir=>{const lane=mv.filter(c=>c.dir===dir).sort((a,b)=>(b.z-a.z)*dir);
      for(let i=1;i<lane.length;i++){const lead=lane[i-1],fol=lane[i];const gap=(lead.z-fol.z)*dir-4.4;
        if(gap<0&&t>T_ENGINE){if(!fol.crashed&&fol.v>1.5){crashes.push({t,x:fol.x,z:fol.z+dir*2.2});fol.yawT+=0.38*dir;lead.yawT-=0.14*dir;
            for(let k=0;k<30;k++)smoke.push({t0:t,x:fol.x+rr(-1,1),y:rr(0.6,1.4),z:fol.z+dir*2.2+rr(-0.5,0.5),vx:rr(-3,3),vy:rr(1,5),vz:rr(-2,2),s:rr(0.2,0.5),debris:k<14,col:k<14?pick(['#d6453d','#cfd3da','#2b2d33','#f2c230']):'#9a97a0'})}
          const vv=(fol.v+lead.v)/2;lead.v=Math.max(lead.v,vv*0.8);fol.v*=0.2;fol.crashed=true;lead.crashed=true;fol.z=lead.z-dir*4.4}}})}
})();
const shirts=['#e04848','#3c8de0','#52c060','#f0d040','#f2f2f2','#e07fd0','#ff8a30','#40c8c8','#6a5ae0'];
const pants=['#2c3245','#3d3d48','#5a4b3a','#24365a'];
const people=[];
for(let i=0;i<230;i++){let x,z;if(R()<0.7){x=rr(-0.8,13);z=rr(-125,25)}else{x=rr(-13.6,-10.6);z=rr(-125,25)}
  people.push({x,z,dir:R()<0.5?1:-1,sp:rr(1.0,1.6),ph:rr(0,6.28),shirt:hex(pick(shirts)),pant:hex(pick(pants)),look:rr(-1,1),h:rr(0.92,1.08),phone:R()<0.45})}
const cityBirds=[];for(let i=0;i<22;i++){const row=Math.floor(i/2)+1,sb=i%2?1:-1;cityBirds.push({ox:sb*row*1.3+rr(-0.3,0.3),oy:-row*0.25+rr(-0.3,0.3),oz:row*1.1,ph:rr(0,6.28),rx:rr(-1,1),ry:rr(-1,1),rz:rr(-1,1),w:rr(2.5,5)})}

// power by z-position
function cityPower(z,t){if(t>=T_AFTER)return 1;if(t<T_BLACK)return 1;
  const off=T_BLACK+(z+240)/320;if(t<off)return 1;if(t<off+0.22)return(Math.floor(t*45+z)%3===0)?1:0;return 0}
const BSOD=t=>t>=T_AFTER;
function drawCitySky(t){const g=ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,'#2f2f73');g.addColorStop(0.45,'#7b4f97');g.addColorStop(0.8,'#e48b98');g.addColorStop(1,'#f6b98f');ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400);
  ctx.fillStyle='rgba(255,210,220,0.18)';for(let i=0;i<6;i++){const x=(i*260+40)%1200-60-cam.yaw*400,y=180+((i*137)%260)+cam.pitch*700;ctx.beginPath();ctx.ellipse(x,y,220,26,0,0,7);ctx.fill()}}
function cityGround(){
  const G=(x0,x1,z0,z1,col)=>{const n=16;for(let i=0;i<n;i++){const za=z0+(z1-z0)*i/n,zb=z0+(z1-z0)*(i+1)/n;poly([[x0,0,za],[x1,0,za],[x1,0,zb],[x0,0,zb]],fogC(col,Math.abs((za+zb)/2-cam.z)))}};
  G(-60,60,60,-330,hex('#7f8090'));G(-10,-2,60,-330,hex('#4f515c'));G(-14,-10,60,-330,hex('#8f909c'));G(-2.45,-2.15,60,-330,hex('#f2cf2e'));
  for(let z=50;z>-300;z-=9)poly([[-5.15,0.01,z],[-4.95,0.01,z],[-4.95,0.01,z-4],[-5.15,0.01,z-4]],fogC(hex('#e6e6ea'),Math.abs(z-cam.z)));
  for(let x=-9.6;x<-2.4;x+=1.1)poly([[x,0.01,-52],[x+0.6,0.01,-52],[x+0.6,0.01,-57],[x,0.01,-57]],fogC(hex('#e9e9ee'),Math.abs(-54-cam.z)))}
function drawBuilding(b,t){
  const cx=(b.x0+b.x1)/2,cz=(b.z0+b.z1)/2;
  const fs=boxFaces(cx,cz,0,b.h,b.x1-b.x0,b.z1-b.z0,0,{top:b.col,side:b.col,front:b.col,back:b.col});
  drawFaces(fs,f=>{const inner=(b.side<0&&f.n[0]>0.5)||(b.side>0&&f.n[0]<-0.5);if(!inner)return;
    const fx=b.side<0?b.x1+0.04:b.x0-0.04;const d=Math.max(1,f.d);
    const pwB=cityPower(cz,t);
    if(d<200){for(const w of b.wins){const[u,v,lit,rv]=w;const col=lit&&pwB>0.5?mix(hex('#ffd59a'),hex('#fff2d0'),rv):hex('#3c4258');
      poly([[fx,v,u-0.65],[fx,v,u+0.65],[fx,v+1.7,u+0.65],[fx,v+1.7,u-0.65]],fogC(col,d))}}
    for(const bl of b.bills){const on=cityPower((bl.u0+bl.u1)/2,t)>0.5;
      poly([[fx,bl.v0-0.25,bl.u0-0.25],[fx,bl.v0-0.25,bl.u1+0.25],[fx,bl.v1+0.25,bl.u1+0.25],[fx,bl.v1+0.25,bl.u0-0.25]],fogC(hex('#2a2b33'),d));
      const fx2=fx+(b.side<0?0.02:-0.02);const P=(v,u)=>[fx2,v,u];
      const cp=clipNear([P(bl.v0,bl.u0),P(bl.v0,bl.u1),P(bl.v1,bl.u1),P(bl.v1,bl.u0)].map(toCam));if(cp.length<3)continue;const ss=cp.map(scr);
      let fill;const bs=BSOD(t);
      if(on&&!bs){const a=ss[0],c=ss[Math.min(2,ss.length-1)];const g=ctx.createLinearGradient(a[0],a[1],c[0],c[1]);const k=0.5+0.5*Math.sin(t*2+bl.flick*6);
        g.addColorStop(0,css(fogC(hex(bl.pal[0]),d*0.6)));g.addColorStop(1,css(fogC(mix(hex(bl.pal[1]),hex(bl.pal[0]),k*0.3),d*0.6)));fill=g}
      else if(on&&bs)fill=css(fogC(bl.flick<0.25?hex('#d42a3a'):hex('#1f50d6'),d*0.6));
      else fill=css(fogC(hex('#15161e'),d*0.8));
      ctx.beginPath();ss.forEach((s,i)=>i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();
      const du=bl.u1-bl.u0,dv=bl.v1-bl.v0;
      if(on&&!bs){const vm=bl.v0+dv*0.32;poly([P(vm,bl.u0+du*0.12),P(vm,bl.u0+du*0.7),P(vm+0.55,bl.u0+du*0.7),P(vm+0.55,bl.u0+du*0.12)],[255,255,255],0.55);
        poly([P(vm+1,bl.u0+du*0.12),P(vm+1,bl.u0+du*0.45),P(vm+1.35,bl.u0+du*0.45),P(vm+1.35,bl.u0+du*0.12)],[255,255,255],0.35)}
      else if(on&&bs){// error screen: frown + text bars

function overlays(t){ctx=ctx0;shakeX=0;shakeY=0;const sc=sceneAt(t);
  // vignette
  const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.5,H*0.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.38)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // hand/phone
  if(t<6.6&&t>=COLD){const drop=ease((t-5.4)/1.1)*1100;shakes(t);drawHand(t,'music',drop);shakeX=0;shakeY=0}
  if(t>=T_PHONE-0.2&&t<LOOP){const rise=(1-easeOut((t-(T_PHONE-0.2))/1.0))*1100;drawHand(t,'cloud',rise)}
  if(t>=COLD&&t<LOOP&&sc==='birds')drawCompass(t,190,1430,120);
  if(sc==='data')drawFilesHUD(t);
  // flashes & transitions
  const flash=(t0,a,d,col)=>{const k=t-t0;if(k>=0&&k<d){ctx.fillStyle=`rgba(${col||'255,255,255'},${a*(1-k/d)})`;ctx.fillRect(0,0,W,H)}};
  flash(T_GONE,0.8,0.35);flash(0.85,0.6,0.2);flash(COLD,0.7,0.25);flash(0,0.5,0.15);flash(T_BACK,0.85,0.45);flash(T_DROP,0.5,0.25,'255,200,120');
  [T_TRAIN,T_SPACE,T_BIRDS,T_DATA,T_AFTER].forEach(tt=>flash(tt,0.55,0.22));
  // pre-transition fade streak
  [T_TRAIN,T_SPACE,T_BIRDS,T_DATA,T_BACK,T_AFTER].forEach(tt=>{const k=tt-t;if(k>0&&k<0.18){ctx.fillStyle=`rgba(255,255,255,${0.5*(1-k/0.18)})`;ctx.fillRect(0,0,W,H)}});
  if(t<3)drawTitle(t);
  drawTimer(t);drawSpeed(t);drawLights(t);drawCaption(t);
  if(t>=T_BACK&&t<T_BACK+1.6){const k=t-T_BACK;const s=k<0.25?0.5+0.5*easeOut(k/0.25):1;const a=Math.min(1,(1.6-k)/0.3);ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,960);ctx.scale(s,s);txt('MAGNETS ARE BACK',0,0,92,'#7dff9a');ctx.restore()}
  if(t>=T_GONE&&t<T_GONE+1.1){const k=t-T_GONE;const s=k<0.2?1.6-0.6*easeOut(k/0.2):1;const a=Math.min(1,(1.1-k)/0.3);ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,960);ctx.scale(s,s);txt('MAGNETS: GONE',0,0,100,'#ff5d5d');ctx.restore()}
  drawEnd(t);{const k=LOOP-t;if(k>0&&k<0.2){ctx.fillStyle=`rgba(255,255,255,${0.6*(1-k/0.2)})`;ctx.fillRect(0,0,W,H)}}}
function frame(fi){const t0=fi/FPS;
  // motion-blurred scene accumulation
  for(let k=0;k<SUB;k++){const t=t0+k/(FPS*SUB);ctx=scn.getContext('2d');ctx.setTransform(1,0,0,1,0,0);renderScene(t);
    actx.globalAlpha=1/(k+1);actx.drawImage(scn,0,0)}
  ctx0.globalAlpha=1;ctx0.drawImage(acc,0,0);
  overlays(t0+(SUB-1)/(2*FPS*SUB))}
window.frame=frame;window.NFR=DUR*FPS;window.crashes=crashes;
</script></body></html>
