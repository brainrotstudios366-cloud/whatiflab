// ================= UTILS =================
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(7);

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}

// ================= CAMERA / 3D =================
let F=930;const cam={x:0,y:0,z:0,yaw:0,pitch:0,roll:0};
let fwd,rgt,up,cR=1,sR=0;
function setCam(){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);

function lookAt(tx,ty,tz){const dx=tx-cam.x,dy=ty-cam.y,dz=tz-cam.z;cam.yaw=Math.atan2(-dx,-dz);cam.pitch=Math.atan2(dy,Math.hypot(dx,dz))}

const NEAR=0.25;let shakeX=0,shakeY=0;
function clipNear(ps){const out=[];for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length];const ain=a[2]>=NEAR,bin=b[2]>=NEAR;if(ain)out.push(a);
  if(ain!==bin){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}return out}
function scr(c){const x=F*c[0]/c[2],y=-F*c[1]/c[2];return[W/2+cR*x-sR*y+shakeX,H*0.5+sR*x+cR*y+shakeY]}
let FOG=hex('#e9a991'),FOGD=150,FOGMAX=0.9;
function fogC(c,d){const f=(1-Math.exp(-Math.max(0,d)/FOGD))*FOGMAX;return mix(c,FOG,f)}
function polyPath(cp){ctx.beginPath();cp.forEach((c,i)=>{const s=scr(c);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])});ctx.closePath()}
function poly(worldPts,col,alpha){const cp=clipNear(worldPts.map(toCam));if(cp.length<3)return null;polyPath(cp);
  ctx.fillStyle=typeof col==='string'?col:css(col,alpha);ctx.fill();if(alpha==null){ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1;ctx.stroke()}return cp}
function dist(p){return toCam(p)[2]}
let L=[-0.35,0.8,0.5];function setLight(v){const n=Math.hypot(...v);L=v.map(x=>x/n)}
let AMB=0.58;function shade(n){return AMB+(1-AMB)*Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2])}
function boxFaces(cx,cz,y0,y1,w,l,yaw,cols){
  const c=Math.cos(yaw),s=Math.sin(yaw);const P=(lx,y,lz)=>[cx+lx*c+lz*s,y,cz-lx*s+lz*c];const hw=w/2,hl=l/2;
  const v={a:P(-hw,y0,-hl),b:P(hw,y0,-hl),c:P(hw,y0,hl),d:P(-hw,y0,hl),e:P(-hw,y1,-hl),f:P(hw,y1,-hl),g:P(hw,y1,hl),h:P(-hw,y1,hl)};

// generic polygon face list (custom shapes): pts world, normal computed
function nrm(p){const a=p[0],b=p[1],c=p[2];const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const m=Math.hypot(...n)||1;return n.map(x=>x/m)}
function facePoly(pts,col,twoSided){const n=nrm(pts);const ctr=pts.reduce((a,p)=>[a[0]+p[0]/pts.length,a[1]+p[1]/pts.length,a[2]+p[2]/pts.length],[0,0,0]);
  const vc=[cam.x-ctr[0],cam.y-ctr[1],cam.z-ctr[2]];let dt=vc[0]*n[0]+vc[1]*n[1]+vc[2]*n[2];
  if(dt<=0){if(!twoSided)return;n[0]=-n[0];n[1]=-n[1];n[2]=-n[2]}

// Catmull-Rom keyframes

  for(const p of ['x','y','z','yaw','pitch','roll']){const p0=k0[p],p1=k1[p],p2=k2[p],p3=k3[p];

R=rng(7);

const buildings=[];
function makeSide(side){let z=40;
  while(z>-240){const len=rr(14,26),h=z>-60?rr(45,85):rr(28,70),d=rr(10,16);const inner=side<0?-14:14;
    const b={side,x0:side<0?inner-d:inner,x1:side<0?inner:inner+d,z0:z-len,z1:z,h,col:hex(pick(bcols)),wins:[],bills:[]};

      if(R()<0.5){const v2=rr(14,20);b.bills.push({u0:u,u1:u+bw,v0:v2,v1:v2+rr(4,9),pal:pick(billPal),flick:R()})}u+=bw+rr(0.6,3)}

const tower={x0:-8,x1:6,z0:-232,z1:-218,h:78,col:hex('#a9adbd')};
const backdrop=[];for(let i=0;i<9;i++){const x=-60+i*14+rr(-3,3);backdrop.push({x0:x,x1:x+rr(10,14),z0:-270,z1:-258,h:rr(40,110),col:hex(pick(bcols))})}
const lamps=[];for(let z=-24;z>-220;z-=22)lamps.push({x:-1.4,z});
function drawCitySky(t){const g=ctx.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,'#2f2f73');g.addColorStop(0.45,'#7b4f97');g.addColorStop(0.8,'#e48b98');g.addColorStop(1,'#f6b98f');ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400);
  ctx.fillStyle='rgba(255,210,220,0.18)';for(let i=0;i<6;i++){const x=(i*260+40)%1200-60-cam.yaw*400,y=180+((i*137)%260)+cam.pitch*700;ctx.beginPath();ctx.ellipse(x,y,220,26,0,0,7);ctx.fill()}}
function cityGround(){
  const G=(x0,x1,z0,z1,col)=>{const n=16;for(let i=0;i<n;i++){const za=z0+(z1-z0)*i/n,zb=z0+(z1-z0)*(i+1)/n;poly([[x0,0,za],[x1,0,za],[x1,0,zb],[x0,0,zb]],fogC(col,Math.abs((za+zb)/2-cam.z)))}};
  G(-60,60,60,-330,hex('#7f8090'));G(-10,-2,60,-330,hex('#4f515c'));G(-14,-10,60,-330,hex('#8f909c'));G(-2.45,-2.15,60,-330,hex('#f2cf2e'));
  for(let z=50;z>-300;z-=9)poly([[-5.15,0.01,z],[-4.95,0.01,z],[-4.95,0.01,z-4],[-5.15,0.01,z-4]],fogC(hex('#e6e6ea'),Math.abs(z-cam.z)));

function drawBuilding(b,t){

      poly([[fx,bl.v0-0.25,bl.u0-0.25],[fx,bl.v0-0.25,bl.u1+0.25],[fx,bl.v1+0.25,bl.u1+0.25],[fx,bl.v1+0.25,bl.u0-0.25]],fogC(hex('#2a2b33'),d));

      const cp=clipNear([P(bl.v0,bl.u0),P(bl.v0,bl.u1),P(bl.v1,bl.u1),P(bl.v1,bl.u0)].map(toCam));if(cp.length<3)continue;const ss=cp.map(scr);
      let fill;const bs=BSOD(t);
      if(on&&!bs){const a=ss[0],c=ss[Math.min(2,ss.length-1)];const g=ctx.createLinearGradient(a[0],a[1],c[0],c[1]);const k=0.5+0.5*Math.sin(t*2+bl.flick*6);
        g.addColorStop(0,css(fogC(hex(bl.pal[0]),d*0.6)));g.addColorStop(1,css(fogC(mix(hex(bl.pal[1]),hex(bl.pal[0]),k*0.3),d*0.6)));fill=g}

function drawTower(t){

function carObj(x,z,yaw,col,brake){

  const cab=boxFaces(x+ox,z+oz,1.02,1.55,1.66,2.3,yaw,{top:col,side:glass,front:glass,back:glass});

  return{d:dist([x,0.8,z]),draw:()=>{drawFaces(wheels);drawFaces(body,f=>{const P=f.P,d=f.d;
      if(f.k==='back'){const tl=brake?hex('#ff2a2a'):hex('#a5262a');poly([P(-0.85,0.72,-2.21),P(-0.45,0.72,-2.21),P(-0.45,0.9,-2.21),P(-0.85,0.9,-2.21)],fogC(tl,d*0.5));poly([P(0.45,0.72,-2.21),P(0.85,0.72,-2.21),P(0.85,0.9,-2.21),P(0.45,0.9,-2.21)],fogC(tl,d*0.5))}
      if(f.k==='front'){const hl=hex('#fff6d8');poly([P(-0.85,0.7,2.21),P(-0.45,0.7,2.21),P(-0.45,0.86,2.21),P(-0.85,0.86,2.21)],fogC(hl,d*0.5));poly([P(0.45,0.7,2.21),P(0.85,0.7,2.21),P(0.85,0.86,2.21),P(0.45,0.86,2.21)],fogC(hl,d*0.5))}});
    drawFaces(cab);if(taxi)drawFaces(boxFaces(x+ox,z+oz,1.55,1.72,0.7,0.3,yaw,{top:hex('#fff3b0'),side:hex('#fff3b0')}))}}}
function lampObj(l,t){const pw=cityPower(l.z,t);const pole=hex('#3b3d46');
