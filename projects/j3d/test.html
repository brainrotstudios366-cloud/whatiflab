<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script><script src="assets.js"></script>
<script>
initGL();initAssets();
const mb=new MB();
terrain(mb,-60,-60,60,60,40,(x,z)=>0.15*fbm(x*0.05,z*0.05),(x,z,h)=>hsh(Math.floor(x/3),Math.floor(z/3))<0.5?C.grass:C.grass2);
house(mb,0,-14,10,8,5,hx('#f2e6d0'),C.roofR,0);house(mb,16,-20,9,8,4.5,hx('#cfd8e0'),C.roofG,0.3);
fence(mb,-12,-4,12,-4,1.0);tree(mb,-8,-10,1.3);tree(mb,9,-6,1.1);tree(mb,-14,6,1.5,0,'pine');tree(mb,12,10,1.2);
car(mb,6,-9,0.4,hx('#d6453d'));
const scene=mb.build();
const c=document.getElementById('c'),ctx=c.getContext('2d');
window.frame=(t)=>{const env={sun:[0.5,0.8,0.35],sunCol:hx('#fff1d8'),sky:hx('#9fc6ee'),gnd:hx('#6f7a55'),fog:hx('#cfe0f0'),fogD:220,zen:hx('#3f7ed4'),hor:hx('#cfe3f4'),stars:0,night:0,emis:1};
 const y=Math.max(0,2*4*((t%1.2)/1.2)*(1-(t%1.2)/1.2));const base=[0,y,0];
 const cam={eye:[3.2,1.6+y*0.6,4.5],at:[0,1+y*0.8,-1],fov:0.95};
 const items=[{mesh:scene},...jumperItems(base,0.6,0,y>0.1?1:0,0)];
 renderGL(env,cam,{center:[0,0,-4],radius:22},items,t);ctx.drawImage(glc,0,0)};
</script></body></html>
